<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: black; /* Black background */
        }
        .container {
            text-align: center;
            border: 5px solid gold; /* Gold border */
            padding: 20px;
            border-radius: 10px;
            background-color: black; /* Black background */
            color: gold; /* Gold text */
            position: relative;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 5px solid gold;
            border-image: url('https://www.publicdomainpictures.net/pictures/320000/velka/rose-border.jpg') 30 round; /* Rose flower border */
            border-radius: 15px;
            pointer-events: none;
        }
        h1 {
            font-size: 3em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wish you a Happy Birthday!</h1>
    </div>
</body>
</html>
